name: Validate and deploy server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - server/**
      - shared/**
      - render.yaml
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  validate-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @invisi-fight/shared build
      - run: pnpm --filter @invisi-fight/server build
      - run: pnpm --filter @invisi-fight/server test
      - name: Trigger Render deploy when configured
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl --fail --request POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
